name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: CLI help smoke test
        run: |
          python scripts/dxf_to_glb.py --help
          python scripts/dxf_to_glb.py build --help
          python scripts/dxf_to_glb.py serve --help
